name: Build Reelicious Android (debug APK)

# Cette compilation ne peut pas se faire dans l'environnement cloud utilisé
# pour développer (accès réseau restreint à dl.google.com, qui héberge le
# SDK Android et une partie des dépendances Gradle) : elle tourne ici, sur
# les machines GitHub, qui ont un accès réseau complet.
on:
  push:
    branches:
      - "**"
    paths:
      - "mobile/android/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelicious-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
